# Production profile — secrets supplied via Render environment variables

# Database (credentials via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# AI
ai.api.url=https://api.groq.com/openai/v1/chat/completions
ai.api.key=${AI_API_KEY}

# File Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/health-records
dashboard.upload-dir=uploads/dashboard-reports

# Logging (less verbose in prod)
logging.level.com.medimind=INFO
