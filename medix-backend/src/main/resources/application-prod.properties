# Production profile — secrets supplied via Render environment variables

# Server port (Render automatically provides the PORT environment variable)
server.port=${PORT:8080}

# Database Driver & Connection (supports SPRING_DATASOURCE_URL or DATABASE_URL fallback)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP Cloud Connection Pool Settings (SSL / Timeouts)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Fast Startup & Lazy Initialization
spring.main.lazy-initialization=true

# JPA / Hibernate — Fast Boot & PostgreSQL Dialect
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Cookie security (true = HTTPS only, required for cross-origin SameSite=None)
app.cookie.secure=true

# AI Config
ai.api.url=https://api.groq.com/openai/v1/chat/completions
ai.api.key=${AI_API_KEY}

# File Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/health-records
dashboard.upload-dir=uploads/dashboard-reports

# Logging (less verbose in prod)
logging.level.com.medimind=INFO

